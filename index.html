<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c9c3b6" />
    <meta name="description" content="Puck was here." />
    <title>Puck was here</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Comic Sans MS", "Bradley Hand", "Segoe Print", cursive;
        background: #c9c3b6;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100svh;
        overflow: hidden;
        color: #171717;
        background:
          radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.34), transparent 32%),
          radial-gradient(ellipse at 78% 74%, rgba(75,66,52,.11), transparent 28%),
          linear-gradient(92deg, transparent 0 31%, rgba(80,70,56,.07) 31.2%, transparent 31.5% 67%, rgba(255,255,255,.16) 67.2%, transparent 67.5%),
          #c9c3b6;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .42;
        background-image:
          repeating-radial-gradient(circle at 20% 30%, rgba(30,27,22,.16) 0 1px, transparent 1px 7px),
          repeating-linear-gradient(176deg, rgba(255,255,255,.12) 0 1px, transparent 1px 11px);
        background-size: 23px 19px, 100% 13px;
        mix-blend-mode: multiply;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 16vmax rgba(44,39,31,.18);
      }

      main {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 7vw;
      }

      .mark {
        position: relative;
        width: min(88vw, 760px);
        transform: rotate(-2.2deg);
        filter: url(#rough-ink);
      }

      .face {
        position: relative;
        width: clamp(148px, 25vw, 224px);
        height: clamp(86px, 14vw, 128px);
        margin: 0 auto -8px;
        border: clamp(5px, .8vw, 8px) solid #171717;
        border-bottom: 0;
        border-radius: 54% 53% 0 0 / 78% 76% 0 0;
      }

      .face::before,
      .face::after {
        content: "";
        position: absolute;
        top: 47%;
        width: clamp(9px, 1.6vw, 14px);
        height: clamp(14px, 2.4vw, 22px);
        border-radius: 50%;
        background: #171717;
      }

      .face::before { left: 27%; transform: rotate(-9deg); }
      .face::after { right: 27%; transform: rotate(7deg); }

      .nose {
        position: absolute;
        left: 50%;
        bottom: 8%;
        width: 19%;
        height: 28%;
        transform: translateX(-50%) rotate(7deg);
        border: clamp(4px, .65vw, 7px) solid #171717;
        border-left-color: transparent;
        border-top-color: transparent;
        border-radius: 25% 20% 52% 42%;
      }

      .hands {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: clamp(75px, 12vw, 111px);
        width: min(74vw, 540px);
        height: 30px;
        transform: translateX(-50%);
      }

      .hands::before,
      .hands::after {
        content: "";
        position: absolute;
        bottom: -3px;
        width: 38px;
        height: 24px;
        border: 6px solid #171717;
        border-bottom: 0;
        border-radius: 50% 50% 0 0;
      }

      .hands::before { left: 5%; transform: rotate(-7deg); }
      .hands::after { right: 5%; transform: rotate(8deg); }

      .wall-line {
        width: 100%;
        height: 8px;
        border-radius: 50%;
        background: #171717;
        transform: rotate(.5deg) scaleX(1.02);
        box-shadow: 0 2px 0 rgba(23,23,23,.46);
      }

      h1 {
        margin: clamp(24px, 4vw, 42px) 0 0;
        font: 900 clamp(3.7rem, 12vw, 8.7rem)/.76 "Comic Sans MS", "Bradley Hand", "Segoe Print", cursive;
        letter-spacing: -.09em;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 2px 1px 0 #171717, -1px 2px 0 #171717;
      }

      h1 span {
        display: block;
      }

      h1 span:first-child { transform: rotate(.7deg) translateX(-.05em); }

      h1 span:last-child {
        margin-top: .21em;
        font-size: .45em;
        letter-spacing: .04em;
        transform: rotate(-1.3deg) translateX(.12em);
      }

      .underline {
        display: block;
        width: 62%;
        height: 20px;
        margin: clamp(22px, 4vw, 36px) auto 0;
        border-top: 8px solid #171717;
        border-radius: 52% 48% 0 0;
        transform: rotate(-2deg) skewX(-12deg);
      }

      .date {
        position: absolute;
        right: 7%;
        bottom: -2.2rem;
        margin: 0;
        font: 700 clamp(.75rem, 1.8vw, 1rem)/1 "Comic Sans MS", "Bradley Hand", cursive;
        letter-spacing: .08em;
        transform: rotate(5deg);
        opacity: .72;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-height: 560px) {
        .mark { transform: rotate(-2.2deg) scale(.75); }
      }

      @media (prefers-reduced-motion: no-preference) {
        .mark { animation: settle .7s cubic-bezier(.18,.88,.32,1.18) both; }
        @keyframes settle {
          from { opacity: 0; transform: rotate(-2.2deg) scale(.94); }
          to { opacity: 1; transform: rotate(-2.2deg) scale(1); }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="mark" aria-labelledby="message">
        <svg class="sr-only" aria-hidden="true" width="0" height="0">
          <filter id="rough-ink">
            <feTurbulence type="fractalNoise" baseFrequency="0.018 0.12" numOctaves="2" seed="23" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </svg>
        <div class="face" aria-hidden="true"><i class="nose"></i></div>
        <div class="hands" aria-hidden="true"></div>
        <div class="wall-line" aria-hidden="true"></div>
        <h1 id="message"><span>Puck</span><span>was here</span></h1>
        <i class="underline" aria-hidden="true"></i>
        <p class="date">PUCK.BEST</p>
      </section>
    </main>
  </body>
</html>
