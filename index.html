<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9fa596" />
    <meta name="description" content="Puck was here." />
    <title>Puck was here</title>
    <style>
      @font-face {
        font-family: "Permanent Marker";
        src: url("/assets/PermanentMarker-Regular.ttf") format("truetype");
        font-display: swap;
      }

      :root {
        color-scheme: light;
        font-family: "Permanent Marker", cursive;
        background: #9fa596;
      }

      * { box-sizing: border-box; }

      html,
      body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100svh;
        color: #171916;
        background:
          radial-gradient(ellipse at 52% -12%, rgba(255, 252, 224, .27), transparent 48%),
          radial-gradient(ellipse at 13% 84%, rgba(70, 76, 66, .15), transparent 34%),
          radial-gradient(ellipse at 91% 58%, rgba(84, 77, 60, .11), transparent 29%),
          #9fa596;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: url("/assets/wall-texture.svg") 0 0 / 720px 720px repeat;
        mix-blend-mode: multiply;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(95deg, rgba(255,255,255,.07), transparent 18% 71%, rgba(53,52,42,.06)),
          linear-gradient(180deg, rgba(255,255,255,.08), transparent 22% 76%, rgba(43,45,40,.11));
        box-shadow: inset 0 0 13vmax rgba(47, 48, 42, .11);
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(2rem, 7vw, 6rem);
      }

      .mark {
        position: relative;
        width: min(86vw, 680px);
        color: #11120f;
        text-align: center;
        transform: rotate(-2.1deg);
        mix-blend-mode: multiply;
      }

      h1 {
        margin: 0;
        font: 400 clamp(4rem, 11vw, 6rem)/.87 "Permanent Marker", cursive;
        letter-spacing: -.035em;
        text-transform: uppercase;
        text-wrap: balance;
        text-shadow:
          .7px .5px 0 rgba(17,18,15,.7),
          -.4px .8px 0 rgba(17,18,15,.52);
      }

      h1 span { display: block; }

      h1 span:first-child {
        transform: rotate(.8deg) translateX(-.035em);
      }

      h1 span:last-child {
        margin-top: .18em;
        font-size: clamp(2.1rem, 5.8vw, 3.2rem);
        letter-spacing: .025em;
        transform: rotate(-1deg) translateX(.08em);
      }

      .underline {
        display: block;
        width: 68%;
        height: 23px;
        margin: clamp(1.6rem, 4vw, 2.5rem) auto 0;
        border-top: clamp(6px, .7vw, 8px) solid currentColor;
        border-radius: 49% 55% 0 0;
        transform: rotate(-2.4deg) skewX(-13deg);
        opacity: .96;
      }

      .signature {
        position: absolute;
        right: 8%;
        bottom: -1.65rem;
        margin: 0;
        font-size: clamp(.68rem, 1.5vw, .86rem);
        letter-spacing: .075em;
        transform: rotate(4deg);
        opacity: .63;
      }

      ::selection {
        color: #ebe8d7;
        background: #20231e;
      }

      @media (max-width: 520px) {
        body::before { background-size: 560px 560px; }

        .mark { width: min(90vw, 430px); }

        h1 { font-size: clamp(3.5rem, 21vw, 5rem); }

        h1 span:last-child { font-size: clamp(1.85rem, 9.2vw, 2.5rem); }

        .underline { width: 76%; }
      }

      @media (max-height: 480px) {
        .mark { transform: rotate(-2.1deg) scale(.78); }
      }

      @media (prefers-reduced-motion: no-preference) {
        .mark {
          animation: appear .72s cubic-bezier(.16, 1, .3, 1) both;
        }

        @keyframes appear {
          from {
            clip-path: inset(0 100% 0 0);
            filter: blur(1.5px);
          }
          to {
            clip-path: inset(-8% -8% -18% -8%);
            filter: blur(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="mark" aria-labelledby="message">
        <h1 id="message"><span>Puck</span><span>was here</span></h1>
        <i class="underline" aria-hidden="true"></i>
        <p class="signature">PUCK.BEST</p>
      </section>
    </main>
  </body>
</html>
